name: Platform Watcher

on:
  schedule:
    # Every Monday 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check-signals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check key platform repos
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const repos = [
              { owner: 'langfuse', repo: 'langfuse', label: 'Langfuse' },
              { owner: 'Arize-ai', repo: 'phoenix', label: 'Arize Phoenix' },
              { owner: 'Agenta-AI', repo: 'agenta', label: 'Agenta' },
            ];

            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);

            let summary = '### Platform activity (last 7 days)\n\n';
            let hasSignal = false;

            for (const r of repos) {
              try {
                const { data: repoData } = await github.rest.repos.get({
                  owner: r.owner,
                  repo: r.repo,
                });

                const { data: releases } = await github.rest.repos.listReleases({
                  owner: r.owner,
                  repo: r.repo,
                  per_page: 5,
                });

                const recent = releases.filter(rel => rel.published_at && new Date(rel.published_at) > oneWeekAgo);
                const stars = repoData.stargazers_count;
                const updated = (repoData.pushed_at || '').slice(0, 10);

                summary += `**${r.label}** — ${stars.toLocaleString()}★ · last push ${updated}`;
                if (recent.length > 0) {
                  hasSignal = true;
                  summary += ` · **new release(s):** ${recent.map(x => x.tag_name).join(', ')}`;
                }
                summary += '\n';
              } catch (e) {
                summary += `**${r.label}** — check failed: ${e.message}\n`;
              }
            }

            summary += '\n_Auto-generated by Platform Watcher. If anything material appears, update RELEASES.md and re-check the ranking._\n';
            summary += `_Manual run: Actions → Platform Watcher → Run workflow._`;

            core.setOutput('summary', summary);
            core.setOutput('has_signal', hasSignal ? 'true' : 'false');

      - name: Create or update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.check.outputs.summary }}`;
            const title = 'Platform Watcher — weekly signal check';

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'platform-watcher',
              per_page: 5,
            });

            const existing = issues.data.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: summary,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: summary,
                labels: ['platform-watcher'],
              });
            }
